[project]
name = "dockctl"
version = "0.1.0"
description = "CLI + daemon for AJAZZ / Mirabox Stream Dock devices, without the vendor app"
readme = "README.md"
authors = [
    { name = "Rahim Nathwani", email = "rahim@encona.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "hidapi>=0.15.0",
    "pillow>=12.3.0",
    "tomlkit>=0.15.1",
]

[project.scripts]
dockctl = "dockctl:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
